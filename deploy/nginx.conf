# ==============================================================================
# TunnelForge Production Nginx Reverse Proxy Configuration
#
# Listens on Port 80 (HTTP redirect to HTTPS) and Port 443 (Wildcard HTTPS).
# Forwards all public tunnel requests, REST API calls, and WebSocket fallback
# connections directly to TunnelForge running on 127.0.0.1:8000.
# ==============================================================================

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name your.domain.com *.your.domain.com;

    # Allow Let's Encrypt HTTP-01 ACME challenges if needed
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Wildcard Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tunnels.pratheepsri.me *.tunnels.pratheepsri.me;

    # Wildcard TLS certificates (Let's Encrypt / Certbot / manual)
    ssl_certificate     /etc/letsencrypt/live/tunnels.pratheepsri.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunnels.pratheepsri.me/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Max upload size (adjust to support large request bodies)
    client_max_body_size 50M;

    # General reverse proxy location for all subdomains & REST endpoints
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Forward original host and IP details
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (enables fallback tunnel at /tunnel)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Disable proxy buffering for low-latency streaming and tunnels
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# Map block to correctly set the Connection header for WebSockets
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
