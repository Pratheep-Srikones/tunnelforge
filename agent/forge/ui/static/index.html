<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TunnelForge Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <script src="index.js" defer></script>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">TF</div>
      <span>TunnelForge</span>
    </div>
    <div class="header-actions">
      <div class="status-indicator">
        <span id="ws-dot" class="status-dot"></span>
        <span id="ws-text">Connecting...</span>
      </div>
      <button id="pause-btn" onclick="togglePause()">Pause</button>
      <button id="clear-btn" onclick="clearLogs()">Clear</button>
    </div>
  </header>

  <div class="container">
    <!-- Left Sidebar: Tunnels -->
    <div class="sidebar">
      <div class="section-title">Active Tunnels</div>
      <ul id="tunnel-list" class="tunnel-list">
        <li style="padding: 16px; color: var(--text-muted); font-size: 0.8rem;">Loading tunnels...</li>
      </ul>
    </div>

    <!-- Center Column: Request Stream -->
    <div class="stream-container">
      <div class="search-bar">
        <input type="text" id="search-input" class="search-input" placeholder="Filter requests by path..." oninput="renderRequests()">
      </div>
      <ul id="request-list" class="request-list">
        <!-- Live requests injected here -->
      </ul>
    </div>

    <!-- Right Column: Inspector -->
    <div class="inspector" id="inspector">
      <div class="empty-state" id="empty-state">
        <p>Select a request from the feed to inspect details</p>
      </div>

      <div id="inspector-content" style="display: none; height: 100%; flex-direction: column;">
        <div class="inspector-header">
          <div class="tabs">
            <button class="tab-btn active" id="tab-btn-request" onclick="switchTab('request')">Request</button>
            <button class="tab-btn" id="tab-btn-response" onclick="switchTab('response')">Response</button>
          </div>
          <div style="display: flex; align-items: center; gap: 12px;">
            <div style="font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 8px;" id="request-meta"></div>
            <button id="replay-btn" class="replay-btn" onclick="replayCurrentRequest()">Replay</button>
          </div>
        </div>

        <div class="inspector-body" id="tab-request">
          <div class="section-title" style="padding-left: 0;">Headers</div>
          <table class="details-table" id="req-headers-table"></table>
          
          <div class="section-title" style="padding-left: 0; margin-top: 16px;">Body</div>
          <pre class="code-block" id="req-body-view">None</pre>
        </div>

        <div class="inspector-body" id="tab-response" style="display: none;">
          <div class="section-title" style="padding-left: 0;">Headers</div>
          <table class="details-table" id="resp-headers-table"></table>
          
          <div class="section-title" style="padding-left: 0; margin-top: 16px;">Body</div>
          <pre class="code-block" id="resp-body-view">None</pre>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
