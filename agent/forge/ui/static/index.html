<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TunnelForge Dashboard</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-surface: #1e293b;
      --bg-card: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --primary: #38bdf8;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --badge-get: #0284c7;
      --badge-post: #10b981;
      --badge-put: #d97706;
      --badge-delete: #dc2626;
      --badge-patch: #8b5cf6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.5px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 900;
      font-size: 14px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--error);
    }

    .status-dot.online {
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    button {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    button:hover {
      background-color: #475569;
    }

    button.active {
      background-color: var(--primary);
      color: #0f172a;
      border-color: var(--primary);
      font-weight: 600;
    }

    /* Main Container */
    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Left Sidebar: Tunnels */
    .sidebar {
      width: 260px;
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .section-title {
      padding: 12px 16px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
    }

    .tunnel-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
    }

    .tunnel-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      transition: background 0.15s;
    }

    .tunnel-item:hover, .tunnel-item.active {
      background-color: #334155;
    }

    .tunnel-item .name {
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tunnel-item .local {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-family: monospace;
    }

    .badge-capture {
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #0284c7;
      color: white;
    }

    /* Middle List: Request Stream */
    .stream-container {
      width: 440px;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      background-color: var(--bg-dark);
    }

    .search-bar {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .search-input:focus {
      outline: 1px solid var(--primary);
    }

    .request-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
    }

    .request-row {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      font-size: 0.82rem;
      gap: 10px;
      transition: background 0.1s;
    }

    .request-row:hover {
      background-color: rgba(51, 65, 85, 0.4);
    }

    .request-row.selected {
      background-color: var(--bg-card);
    }

    .status-badge {
      font-weight: 700;
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 4px;
      width: 42px;
      text-align: center;
    }

    .status-2xx { color: #34d399; background: rgba(52, 211, 153, 0.15); }
    .status-3xx { color: #60a5fa; background: rgba(96, 165, 250, 0.15); }
    .status-4xx { color: #fbbf24; background: rgba(251, 191, 36, 0.15); }
    .status-5xx { color: #f87171; background: rgba(248, 113, 113, 0.15); }

    .method-badge {
      font-weight: 700;
      font-size: 0.68rem;
      padding: 2px 6px;
      border-radius: 4px;
      min-width: 44px;
      text-align: center;
      color: white;
    }

    .method-GET { background-color: var(--badge-get); }
    .method-POST { background-color: var(--badge-post); }
    .method-PUT { background-color: var(--badge-put); }
    .method-DELETE { background-color: var(--badge-delete); }
    .method-PATCH { background-color: var(--badge-patch); }

    .path-col {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: monospace;
      font-size: 0.8rem;
    }

    .meta-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* Right Inspector */
    .inspector {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-surface);
      overflow: hidden;
    }

    .inspector-header {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tabs {
      display: flex;
      gap: 4px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 12px;
      font-weight: 600;
      border-radius: 4px;
    }

    .tab-btn.active {
      color: var(--primary);
      background-color: var(--bg-dark);
    }

    .inspector-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }

    .details-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
      font-size: 0.8rem;
      font-family: monospace;
    }

    .details-table th, .details-table td {
      padding: 6px 10px;
      border: 1px solid var(--border-color);
      text-align: left;
    }

    .details-table th {
      background-color: var(--bg-dark);
      color: var(--text-muted);
      width: 25%;
    }

    .code-block {
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.82rem;
      white-space: pre-wrap;
      word-break: break-all;
      color: #38bdf8;
      max-height: 400px;
      overflow-y: auto;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      font-size: 0.9rem;
      gap: 8px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">TF</div>
      <span>TunnelForge</span>
    </div>
    <div class="header-actions">
      <div class="status-indicator">
        <span id="ws-dot" class="status-dot"></span>
        <span id="ws-text">Connecting...</span>
      </div>
      <button id="pause-btn" onclick="togglePause()">Pause</button>
      <button id="clear-btn" onclick="clearLogs()">Clear</button>
    </div>
  </header>

  <div class="container">
    <!-- Left Sidebar: Tunnels -->
    <div class="sidebar">
      <div class="section-title">Active Tunnels</div>
      <ul id="tunnel-list" class="tunnel-list">
        <li style="padding: 16px; color: var(--text-muted); font-size: 0.8rem;">Loading tunnels...</li>
      </ul>
    </div>

    <!-- Center Column: Request Stream -->
    <div class="stream-container">
      <div class="search-bar">
        <input type="text" id="search-input" class="search-input" placeholder="Filter requests by path..." oninput="renderRequests()">
      </div>
      <ul id="request-list" class="request-list">
        <!-- Live requests injected here -->
      </ul>
    </div>

    <!-- Right Column: Inspector -->
    <div class="inspector" id="inspector">
      <div class="empty-state" id="empty-state">
        <p>Select a request from the feed to inspect details</p>
      </div>

      <div id="inspector-content" style="display: none; height: 100%; flex-direction: column;">
        <div class="inspector-header">
          <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('request')">Request</button>
            <button class="tab-btn" onclick="switchTab('response')">Response</button>
          </div>
          <div style="font-size: 0.8rem; color: var(--text-muted);" id="request-meta"></div>
        </div>

        <div class="inspector-body" id="tab-request">
          <div class="section-title" style="padding-left: 0;">Headers</div>
          <table class="details-table" id="req-headers-table"></table>
          
          <div class="section-title" style="padding-left: 0; margin-top: 16px;">Body</div>
          <pre class="code-block" id="req-body-view">None</pre>
        </div>

        <div class="inspector-body" id="tab-response" style="display: none;">
          <div class="section-title" style="padding-left: 0;">Headers</div>
          <table class="details-table" id="resp-headers-table"></table>
          
          <div class="section-title" style="padding-left: 0; margin-top: 16px;">Body</div>
          <pre class="code-block" id="resp-body-view">None</pre>
        </div>
      </div>
    </div>
  </div>

  <script>
    let isPaused = false;
    let selectedTunnel = null;
    let selectedRequestID = null;
    let requests = [];
    let ws = null;

    // Connect WebSocket
    function connectWS() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${location.host}/ws`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        document.getElementById('ws-dot').className = 'status-dot online';
        document.getElementById('ws-text').innerText = 'Live';
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'request' && data.entry) {
            handleNewRequest(data.entry);
          }
        } catch (e) {
          console.error('Error parsing WS event:', e);
        }
      };

      ws.onclose = () => {
        document.getElementById('ws-dot').className = 'status-dot';
        document.getElementById('ws-text').innerText = 'Disconnected';
        setTimeout(connectWS, 2000);
      };
    }

    // Load active tunnels
    async function loadTunnels() {
      try {
        const res = await fetch('/api/tunnels');
        const data = await res.json();
        const listEl = document.getElementById('tunnel-list');
        listEl.innerHTML = '';

        // All Tunnels option
        const allLi = document.createElement('li');
        allLi.className = `tunnel-item ${selectedTunnel === null ? 'active' : ''}`;
        allLi.innerHTML = `<div class="name">All Tunnels</div>`;
        allLi.onclick = () => selectTunnel(null);
        listEl.appendChild(allLi);

        for (const [subdomain, entry] of Object.entries(data)) {
          const li = document.createElement('li');
          li.className = `tunnel-item ${selectedTunnel === subdomain ? 'active' : ''}`;
          li.innerHTML = `
            <div class="name">
              <span>${subdomain}</span>
              ${entry.capture ? '<span class="badge-capture">Capture</span>' : ''}
            </div>
            <div class="local">${entry.local}</div>
          `;
          li.onclick = () => selectTunnel(subdomain);
          listEl.appendChild(li);
        }
      } catch (err) {
        console.error('Error loading tunnels:', err);
      }
    }

    // Load request history
    async function loadRequests() {
      try {
        let url = '/api/requests?limit=100';
        if (selectedTunnel) {
          url += `&subdomain=${encodeURIComponent(selectedTunnel)}`;
        }
        const res = await fetch(url);
        const data = await res.json();
        requests = data || [];
        renderRequests();
      } catch (err) {
        console.error('Error loading requests:', err);
      }
    }

    function selectTunnel(subdomain) {
      selectedTunnel = subdomain;
      loadTunnels();
      loadRequests();
    }

    function handleNewRequest(entry) {
      if (isPaused) return;
      if (selectedTunnel && entry.subdomain !== selectedTunnel) return;

      requests.unshift(entry);
      if (requests.length > 200) requests.pop();
      renderRequests();
    }

    function renderRequests() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const listEl = document.getElementById('request-list');
      listEl.innerHTML = '';

      const filtered = requests.filter(r => !search || r.url.toLowerCase().includes(search));

      filtered.forEach(req => {
        const row = document.createElement('li');
        row.className = `request-row ${req.id === selectedRequestID ? 'selected' : ''}`;
        
        let statusClass = 'status-2xx';
        if (req.response_status >= 500) statusClass = 'status-5xx';
        else if (req.response_status >= 400) statusClass = 'status-4xx';
        else if (req.response_status >= 300) statusClass = 'status-3xx';

        const timeStr = new Date(req.timestamp).toLocaleTimeString();

        row.innerHTML = `
          <span class="status-badge ${statusClass}">${req.response_status || '---'}</span>
          <span class="method-badge method-${req.method}">${req.method}</span>
          <span class="path-col">${req.url}</span>
          <div class="meta-col">
            <span>${req.duration_ms}ms</span>
            <span>${timeStr}</span>
          </div>
        `;

        row.onclick = () => selectRequest(req);
        listEl.appendChild(row);
      });
    }

    function selectRequest(req) {
      selectedRequestID = req.id;
      renderRequests();

      document.getElementById('empty-state').style.display = 'none';
      const content = document.getElementById('inspector-content');
      content.style.display = 'flex';

      document.getElementById('request-meta').innerText = `${req.method} ${req.url} (${req.duration_ms}ms)`;

      // Request tab
      renderHeaders('req-headers-table', req.request_headers);
      renderBody('req-body-view', req.request_body);

      // Response tab
      renderHeaders('resp-headers-table', req.response_headers);
      renderBody('resp-body-view', req.response_body);
    }

    function renderHeaders(tableId, headers) {
      const table = document.getElementById(tableId);
      table.innerHTML = '';
      if (!headers || Object.keys(headers).length === 0) {
        table.innerHTML = '<tr><td colspan="2" style="color: var(--text-muted);">No headers</td></tr>';
        return;
      }
      for (const [k, v] of Object.entries(headers)) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<th>${k}</th><td>${Array.isArray(v) ? v.join(', ') : v}</td>`;
        table.appendChild(tr);
      }
    }

    function renderBody(viewId, bodyData) {
      const view = document.getElementById(viewId);
      if (!bodyData) {
        view.innerText = '(empty body)';
        return;
      }

      const text = decodeBase64(bodyData);
      try {
        const parsed = JSON.parse(text);
        view.innerText = JSON.stringify(parsed, null, 2);
      } catch {
        view.innerText = text;
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('tab-request').style.display = tab === 'request' ? 'block' : 'none';
      document.getElementById('tab-response').style.display = tab === 'response' ? 'block' : 'none';
      event.target.classList.add('active');
    }

    function togglePause() {
      isPaused = !isPaused;
      const btn = document.getElementById('pause-btn');
      btn.classList.toggle('active', isPaused);
      btn.innerText = isPaused ? 'Resume' : 'Pause';
    }

    function decodeBase64(b64) {
      if (!b64 || typeof b64 !== 'string') return '';
      try {
        const binString = atob(b64);
        const bytes = Uint8Array.from(binString, c => c.codePointAt(0));
        return new TextDecoder().decode(bytes);
      } catch (e) {
        return b64;
      }
    }

    async function clearLogs() {
      requests = [];
      renderRequests();
      document.getElementById('empty-state').style.display = 'flex';
      document.getElementById('inspector-content').style.display = 'none';
      selectedRequestID = null;

      if (selectedTunnel) {
        await fetch(`/api/requests?subdomain=${encodeURIComponent(selectedTunnel)}`, { method: 'DELETE' });
      }
    }

    // Init
    connectWS();
    loadTunnels();
    loadRequests();
  </script>
</body>
</html>
